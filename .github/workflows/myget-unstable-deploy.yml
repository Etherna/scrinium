name: Unstable release deploy to MyGet

on:
  push:
    branches:
      - dev
      - 'hotfix/**'
      - 'release/**'

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    env:
      MONGODM_TEST_DB_URL: mongodb://localhost:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Transactions require a replica set: service containers can't override the
      # command, so run the container directly and initiate a single node replica set.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:8 mongod --replSet rs0 --bind_ip_all
          timeout 60 bash -c 'until docker exec mongodb mongosh --quiet --eval "db.hello().ok" >/dev/null 2>&1; do sleep 1; done'
          docker exec mongodb mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          timeout 60 bash -c 'until docker exec mongodb mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do sleep 1; done'

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build

      - name: Generate nuget package
        run: dotnet pack --configuration Release --no-build -o nupkg

      - name: Push packages
        run: dotnet nuget push './nupkg/*.nupkg' --api-key ${{secrets.MYGET_APIKEY}} --source https://www.myget.org/F/etherna/api/v3/index.json
